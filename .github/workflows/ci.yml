name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest --ignore=tests/integrations --cov=forehear --cov-report=term-missing

  integrations:
    name: integrations (Pipecat + LiveKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,pipecat,livekit]"
      - run: pytest tests/integrations -W ignore::DeprecationWarning

  benchmark-smoke:
    name: benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: forehear bench --limit 300 --profiles hosted_kb rerank --no-plots --quiet --out /tmp/forehear-results
      - run: forehear replay --index 3 --policy stable_prefix
