[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "forehear"
version = "0.1.0"
description = "Look-ahead retrieval for voice agents: start RAG while the user is still talking, and measure whether it pays off."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sagarthegreat" }]
keywords = ["voice-agents", "rag", "retrieval", "speculative-execution", "latency", "asr", "pipecat", "livekit", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dense = ["numpy>=1.24", "model2vec>=0.4"]
pipecat = ["pipecat-ai>=0.0.80"]
livekit = ["livekit-agents>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "numpy>=1.24"]

[project.scripts]
forehear = "forehear.bench.cli:main"

[project.urls]
Homepage = "https://github.com/sagarthegreat/Infinity"
Repository = "https://github.com/sagarthegreat/Infinity"
Issues = "https://github.com/sagarthegreat/Infinity/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forehear"]

[tool.hatch.build.targets.sdist]
include = ["src/forehear", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src/forehear"]

[[tool.mypy.overrides]]
module = ["forehear.integrations.*"]
disallow_any_unimported = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pipecat.*", "livekit.*", "matplotlib.*", "model2vec.*", "numpy.*"]
ignore_missing_imports = true
